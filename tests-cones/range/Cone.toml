schema = 1

[cone]
group = "scoop.grid.tests"
name = "range"
version = "0.1.0"
kind = "library"

[[test.sources]]
path = "tests"
when = { os = "darwin" }

[dependencies]
"scoop:scoop.core" = "0.1.0"

[test-dependencies]
"scoop:scoop.grid" = { version = "0.1.0", path = "../.." }
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.ui" = "0.1.0"
"scoop:scoop.ui.component" = "0.1.0"
"scoop:scoop.ui.style" = "0.1.0"
"scoop:scoop.ui.style.shadcn" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop.tests:ui-accessibility-native" = { version = "0.1.0", path = "../../../scoop/sysroot/src/scoop.ui/test-native" }

"scoop.tests:window-native" = { version = "0.1.0", path = "../../../scoop/sysroot/src/scoop.window/test-native" }

[native]
objc_flags = ["-Wall", "-Wextra", "-Werror"]

[[native.sources]]
path = "native/range.m"
when = { os = "darwin" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
